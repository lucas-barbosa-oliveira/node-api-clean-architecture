# Atualizações automáticas de dependências (abre pull requests semanais, agrupados).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      eslint:
        patterns: ["eslint*", "@eslint/*", "@typescript-eslint/*", "@stylistic/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # imagens do docker-compose*.yml (Mongo, Redis, InfluxDB, RabbitMQ, Kong, Vault, LGTM...)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # o InfluxDB 3 não executa Flux, usado pela API (src/infrastructure/timeseries): migração planejada, não automática
      - dependency-name: influxdb
        update-types: ["version-update:semver-major"]
  # providers do módulo OpenTofu do Vault (mesmo formato de versão do Terraform)
  - package-ecosystem: terraform
    directory: /infra/vault
    schedule:
      interval: weekly
