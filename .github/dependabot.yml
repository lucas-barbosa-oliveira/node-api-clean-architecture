# Atualizações automáticas de dependências (abre pull requests semanais, agrupados).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      eslint:
        patterns: ["eslint*", "@eslint/*", "@typescript-eslint/*", "@stylistic/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
