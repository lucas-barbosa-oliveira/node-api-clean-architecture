# Camada de TLS sobre o docker-compose.yml: todas as conexões internas cifradas e autenticadas por certificado.
#
#   npm run docker:up:tls     tudo em containers; clientes acessam o Kong em https://localhost:8443
#   npm run docker:infra:tls  só as dependências com TLS; a API roda no host (npm run dev:docker:tls)
#
# Os dois rodam antes npm run tls:setup (CA local e certificados em ./certs) e npm run kong:setup com upstream https.
# Uso direto: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
#   cliente -> Kong     HTTPS na 8443 (a 8000 em HTTP continua aberta para compatibilidade; feche-a em produção)
#   Kong -> API         HTTPS verificado + certificado do Kong (a API só aceita quem tem certificado da CA: mTLS)
#   API -> Mongo/Redis/RabbitMQ   TLS + certificado da API (os servidores exigem certificado de cliente: mTLS)
#   API -> InfluxDB     HTTPS verificado (o InfluxDB não suporta certificado de cliente)
#   API/Kong -> LGTM    OTLP em HTTP: o otel-lgtm não tem TLS no receptor (veja "Pontos de atenção" no README)
#
# Cada container monta só o próprio certificado e chave, mais a CA. A chave da CA (certs/ca.key) não é montada.
services:
  mongo:
    command:
      - --replSet
      - rs0
      - --bind_ip_all
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /certs/mongo.pem
      - --tlsCAFile
      - /certs/ca.crt
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/mongo.pem:/certs/mongo.pem:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --tls
        - --tlsCAFile
        - /certs/ca.crt
        - --tlsCertificateKeyFile
        - /certs/mongo.pem
        - --host
        - localhost
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"

  redis:
    # mesma porta (6379), só com TLS (--port 0 desliga a porta sem TLS); certificado de cliente obrigatório
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /certs/redis.crt
      - --tls-key-file
      - /certs/redis.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "yes"
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/redis.crt:/certs/redis.crt:ro
      - ./certs/redis.key:/certs/redis.key:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/certs/ca.crt", "--cert", "/certs/redis.crt", "--key", "/certs/redis.key", "-h", "localhost", "ping"]

  influxdb:
    environment:
      INFLUXD_TLS_CERT: /certs/influxdb.crt
      INFLUXD_TLS_KEY: /certs/influxdb.key
      INFLUXD_TLS_MIN_VERSION: "1.2"
    volumes:
      - ./certs/influxdb.crt:/certs/influxdb.crt:ro
      - ./certs/influxdb.key:/certs/influxdb.key:ro
    healthcheck:
      # o ping é local ao container; --skip-verify porque o CLI do influx não aceita CA própria
      test: ["CMD", "influx", "ping", "--host", "https://localhost:8086", "--skip-verify"]

  rabbitmq:
    ports: !override # substitui as portas sem TLS (5672 e 15672) do docker-compose.yml
      - "127.0.0.1:5671:5671" # AMQPS
      - "127.0.0.1:15671:15671" # interface web em HTTPS
    volumes:
      - ./rabbitmq/20-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/rabbitmq.crt:/certs/rabbitmq.crt:ro
      - ./certs/rabbitmq.key:/certs/rabbitmq.key:ro

  api:
    environment:
      MONGO_TLS: "true"
      REDIS_URL: rediss://redis:6379
      RABBITMQ_URI: amqps://app:app-rabbit-local@rabbitmq:5671
      INFLUX_URL: https://influxdb:8086
      # CA e identidade da API para todas as conexões de saída
      TLS_CA_FILE: /app/certs/ca.crt
      TLS_CLIENT_CERT_FILE: /app/certs/api.crt
      TLS_CLIENT_KEY_FILE: /app/certs/api.key
      # a API em HTTPS, aceitando só clientes com certificado da CA (o Kong)
      SERVER_TLS: "true"
      SERVER_TLS_CERT_FILE: /app/certs/api.crt
      SERVER_TLS_KEY_FILE: /app/certs/api.key
      SERVER_TLS_CA_FILE: /app/certs/ca.crt
      SERVER_TLS_CLIENT_AUTH: require
    volumes:
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/api.crt:/app/certs/api.crt:ro
      - ./certs/api.key:/app/certs/api.key:ro

  kong:
    environment:
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl http2
      KONG_SSL_CERT: /certs/kong.crt
      KONG_SSL_CERT_KEY: /certs/kong.key
      KONG_SSL_PROTOCOLS: TLSv1.2 TLSv1.3
    ports:
      - "127.0.0.1:8443:8443" # proxy HTTPS
    volumes:
      - ./certs/kong.crt:/certs/kong.crt:ro
      - ./certs/kong.key:/certs/kong.key:ro
