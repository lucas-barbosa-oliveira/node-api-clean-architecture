# TLS do RabbitMQ (usado só com docker-compose.tls.yml, montado em /etc/rabbitmq/conf.d/).
# AMQP apenas com TLS (amqps://, porta 5671) e certificado de cliente obrigatório (mTLS).
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /certs/ca.crt
ssl_options.certfile = /certs/rabbitmq.crt
ssl_options.keyfile = /certs/rabbitmq.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

# interface de administração em HTTPS (https://localhost:15671), sem exigir certificado do navegador
management.ssl.port = 15671
management.ssl.cacertfile = /certs/ca.crt
management.ssl.certfile = /certs/rabbitmq.crt
management.ssl.keyfile = /certs/rabbitmq.key
