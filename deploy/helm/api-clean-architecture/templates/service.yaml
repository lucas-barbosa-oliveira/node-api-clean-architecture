apiVersion: v1
kind: Service
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.kong.enabled .Values.kong.upstream.tls }}
    # Kong -> API em HTTPS: verifica o certificado da API com a CA do Vault e apresenta o certificado do Kong (mTLS)
    konghq.com/protocol: https
    konghq.com/tls-verify: "true"
    konghq.com/tls-verify-depth: "2"
    konghq.com/client-cert: {{ .Values.kong.upstream.clientCertSecret | quote }}
    konghq.com/ca-certificates-secrets: {{ .Values.kong.upstream.caSecret | quote }}
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "api.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ ternary "https" "http" .Values.server.tls.enabled }}
      port: {{ .Values.server.port }}
      targetPort: {{ ternary "https" "http" .Values.server.tls.enabled }}
    - name: metrics
      port: {{ .Values.server.metricsPort }}
      targetPort: metrics
