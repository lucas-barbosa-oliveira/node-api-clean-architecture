{{- if .Values.metrics.prometheusRule.enabled }}
{{- $sel := default (printf "job=\"%s\"" (include "api.fullname" .)) .Values.metrics.prometheusRule.selector -}}
{{- $slo := .Values.metrics.prometheusRule.slo -}}
{{- $budget := subf 1.0 $slo.availability -}}
{{- /* SLO de disponibilidade: alertas de "burn rate" em duas janelas (Google SRE Workbook) */}}
{{- $errors := printf "sum(rate(http_server_request_duration_seconds_count{%s,http_response_status_code=~\"5..\"}[%%s])) / sum(rate(http_server_request_duration_seconds_count{%s}[%%s]))" $sel $sel -}}
{{- $slow := printf "1 - (sum(rate(http_server_request_duration_seconds_bucket{%s,le=\"%v\"}[%%s])) / sum(rate(http_server_request_duration_seconds_count{%s}[%%s])))" $sel $slo.latencySeconds $sel -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "api.fullname" . }}.slo
      rules:
        - alert: ApiErrorBudgetBurnFast
          expr: |
            ({{ printf $errors "1h" "1h" }}) > {{ mulf 14.4 $budget }}
            and
            ({{ printf $errors "5m" "5m" }}) > {{ mulf 14.4 $budget }}
          labels:
            severity: critical
          annotations:
            summary: "Erros 5xx consumindo o orçamento do SLO ({{ mulf 100 $slo.availability }}%) 14x mais rápido que o aceitável"
            description: "Nesse ritmo, o orçamento de 30 dias acaba em ~2 dias. Veja /health/ready e os logs de erro."
        - alert: ApiErrorBudgetBurnSlow
          expr: |
            ({{ printf $errors "6h" "6h" }}) > {{ mulf 6 $budget }}
            and
            ({{ printf $errors "30m" "30m" }}) > {{ mulf 6 $budget }}
          labels:
            severity: warning
          annotations:
            summary: "Erros 5xx consumindo o orçamento do SLO 6x mais rápido que o aceitável"
        - alert: ApiLatencySloAtRisk
          expr: |
            ({{ printf $slow "1h" "1h" }}) > {{ mulf 2 (subf 1.0 $slo.latencyTarget) }}
            and
            ({{ printf $slow "5m" "5m" }}) > {{ mulf 2 (subf 1.0 $slo.latencyTarget) }}
          labels:
            severity: warning
          annotations:
            summary: "Mais de {{ mulf 200 (subf 1.0 $slo.latencyTarget) }}% das requisições acima de {{ $slo.latencySeconds }}s"
    - name: {{ include "api.fullname" . }}.operacao
      rules:
        - alert: ApiOutboxStuck
          expr: max(outbox_oldest_pending_age_seconds{ {{- $sel -}} }) > 300
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Eventos parados no outbox há mais de 5 minutos (RabbitMQ fora do ar ou evento recusado)"
        - alert: ApiDeadLetteredMessages
          expr: sum(increase(eventbus_dead_lettered_total{ {{- $sel -}} }[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "Mensagens foram para a fila <serviço>.dlq (subscriber falhou em todas as tentativas)"
        - alert: ApiJobsFailing
          expr: |
            sum(rate(jobs_completed_total{ {{- $sel -}} ,status="failed"}[30m]))
            / clamp_min(sum(rate(jobs_completed_total{ {{- $sel -}} }[30m])), 1e-9) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Mais de 10% dos jobs falhando"
        - alert: ApiEventLoopLag
          expr: max(nodejs_eventloop_delay_p99_seconds{ {{- $sel -}} }) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Event loop com atraso p99 acima de 200 ms (CPU saturada ou operação síncrona longa)"
        - alert: ApiDown
          expr: absent(up{ {{- $sel -}} } == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Nenhuma instância da API respondendo à coleta de métricas"
{{- end }}
