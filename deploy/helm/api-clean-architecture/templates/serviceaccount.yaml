{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api.serviceAccountName" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# a API não chama a API do Kubernetes; o token projetado serve só para o Vault (Kubernetes auth)
automountServiceAccountToken: {{ .Values.vault.enabled }}
{{- end }}
