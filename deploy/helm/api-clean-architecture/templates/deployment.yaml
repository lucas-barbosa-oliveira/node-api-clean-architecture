{{- if and .Values.kong.enabled (not .Values.kong.jwt.publicKey) }}
{{- fail "kong.jwt.publicKey é obrigatório (vault kv get -field=public_key kv/api/jwt)" }}
{{- end }}
{{- if and (not .Values.vault.enabled) (not .Values.secrets.existingSecret) }}
{{- fail "defina vault.enabled=true ou secrets.existingSecret (de onde vêm os segredos)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.vault.enabled }}
        {{- include "api.vaultAnnotations" (dict "root" .) | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "api.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ ternary "https" "http" .Values.server.tls.enabled }}
              containerPort: {{ .Values.server.port }}
            - name: health
              containerPort: {{ .Values.server.healthPort }}
            - name: metrics
              containerPort: {{ .Values.server.metricsPort }}
          env:
            {{- include "api.env" (dict "root" .) | nindent 12 }}
          # liveness não olha dependências (só o processo); readiness tira a instância do balanceamento sem reiniciar
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # tempo para o Kong e os Endpoints deixarem de mandar tráfego antes do SIGTERM
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if not .Values.vault.enabled }}
            - name: secrets
              mountPath: {{ include "api.secretsDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.vault.enabled }}
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.existingSecret }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{ toYaml . | nindent 10 | trim }}
          labelSelector:
            matchLabels:
              {{- include "api.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
