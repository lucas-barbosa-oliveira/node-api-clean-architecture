# Camada do Vault sobre docker-compose.yml + docker-compose.tls.yml: segredos, certificados e credenciais vindos do
# Vault, como no Kubernetes.
#
#   npm run docker:up:vault     tudo em containers (https://localhost:8443 pelo Kong)
#   npm run docker:infra:vault  dependências; a API roda no host com npm run dev:docker:vault
#
# Os dois rodam scripts/vault.local.ts, que recria o Vault (modo dev, em memória), aplica dev/vault com OpenTofu (os
# módulos da plataforma no ambiente "local") e só então sobe o resto. Do Vault vêm:
#   - certificados de Mongo, Redis, RabbitMQ, InfluxDB e Kong (PKI, gravados em certs/ como no tls:setup);
#   - para a API, pelo Vault Agent (.vault/secrets): usuário temporário do Mongo e do RabbitMQ, senha do Redis, token
#     do InfluxDB, senha do admin, chaves dos JWTs e o próprio certificado (renovado sozinho);
#   - a cifra dos segredos do MFA (Transit), pelo proxy do Agent.
# Interface do Vault: http://localhost:8200 (token: dev-root-token).
services:
  vault:
    image: hashicorp/vault:1.20.0
    command: ["server", "-dev", "-dev-root-token-id=dev-root-token", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add: [IPC_LOCK]
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 3s
      retries: 20

  vault-agent:
    image: hashicorp/vault:1.20.0
    command: ["agent", "-config=/vault/config/agent.hcl"]
    # mesmo uid do usuário "node" da imagem da API: os arquivos com chave (0600) ficam legíveis para ela
    user: "1000:1000"
    environment:
      HOME: /tmp
      # o entrypoint da imagem (set -e) faz chown e setcap, que falham sem root e derrubam o container;
      # o Agent não precisa de nenhum dos dois
      SKIP_CHOWN: "true"
      SKIP_SETCAP: "true"
    volumes:
      - ./.vault/agent.hcl:/vault/config/agent.hcl:ro
      - ./.vault/templates:/vault/templates:ro
      - ./.vault/approle:/vault/approle:ro
      - ./.vault/secrets:/vault/secrets
    ports:
      - "127.0.0.1:8100:8100" # proxy do Agent (Transit), para a API rodando no host
    depends_on:
      vault:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # pronto quando o último template (certificado da API) foi gravado
      test: ["CMD-SHELL", "test -s /vault/secrets/api-cert && test -s /vault/secrets/mongo-password"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Autenticação ligada (o Vault cria usuários temporários). Volume próprio: o do modo sem Vault não tem usuários.
  mongo:
    entrypoint:
      - bash
      - -c
      - head -c 756 /dev/urandom | base64 > /tmp/keyfile && chmod 400 /tmp/keyfile && chown 999:999 /tmp/keyfile && exec docker-entrypoint.sh "$$@"
      - mongo-entrypoint
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /tmp/keyfile
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /certs/mongo.pem
      - --tlsCAFile
      - /certs/ca.crt
    volumes:
      - mongo-vault-data:/data/db
      - ./infra/local/mongo/healthcheck.js:/scripts/healthcheck.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --tls
        - --tlsCAFile
        - /certs/ca.crt
        - --tlsCertificateKeyFile
        - /certs/mongo.pem
        - --host
        - localhost
        - /scripts/healthcheck.js

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - redis-local-pass # o mesmo de static_secrets.redis_password em dev/vault/main.tf
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /certs/redis.crt
      - --tls-key-file
      - /certs/redis.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "yes"
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/certs/ca.crt", "--cert", "/certs/redis.crt", "--key", "/certs/redis.key", "-h", "localhost", "--no-auth-warning", "-a", "redis-local-pass", "ping"]

  rabbitmq:
    volumes:
      - ./rabbitmq/30-vault.conf:/etc/rabbitmq/conf.d/30-vault.conf:ro

  api:
    environment:
      # credenciais e certificados entregues pelo Vault Agent (relidos sozinhos quando o Agent troca os arquivos)
      MONGO_USERNAME_FILE: /vault/secrets/mongo-username
      MONGO_PASSWORD_FILE: /vault/secrets/mongo-password
      RABBITMQ_URI: amqps://rabbitmq:5671
      RABBITMQ_USERNAME_FILE: /vault/secrets/rabbitmq-username
      RABBITMQ_PASSWORD_FILE: /vault/secrets/rabbitmq-password
      REDIS_PASSWORD_FILE: /vault/secrets/redis-password
      INFLUX_TOKEN: ""
      INFLUX_TOKEN_FILE: /vault/secrets/influx-token
      ADMIN_PASSWORD: ""
      ADMIN_PASSWORD_FILE: /vault/secrets/admin-password
      JWT_PRIVATE_KEY_PATH: /vault/secrets/jwt-private-key
      JWT_PUBLIC_KEY_PATH: /vault/secrets/jwt-public-key
      TLS_CA_FILE: /vault/secrets/ca-cert
      TLS_CLIENT_CERT_FILE: /vault/secrets/api-cert
      TLS_CLIENT_KEY_FILE: /vault/secrets/api-key
      SERVER_TLS_CERT_FILE: /vault/secrets/api-cert
      SERVER_TLS_KEY_FILE: /vault/secrets/api-key
      SERVER_TLS_CA_FILE: /vault/secrets/ca-cert
      # MFA cifrado pelo Transit, via proxy do Agent (MFA_ENCRYPTION_KEY continua só para ler segredos antigos)
      MFA_CIPHER: vault-transit
      VAULT_ADDR: http://vault-agent:8100
      VAULT_TRANSIT_MOUNT: local/transit # convenção da plataforma: <ambiente>/transit, chave <projeto>-<serviço>
      VAULT_TRANSIT_KEY: matrixgrid-api-clean-architecture
      # índices pelo job de migração, como no Kubernetes (scripts/vault.local.ts roda npm run db:migrate)
      MONGO_AUTO_INDEX: "false"
    volumes: !override
      - ./.vault/secrets:/vault/secrets:ro
    depends_on:
      vault-agent:
        condition: service_healthy

volumes:
  mongo-vault-data:
