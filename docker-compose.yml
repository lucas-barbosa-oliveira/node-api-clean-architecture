# Ambiente completo: API + Mongo + Redis + InfluxDB + RabbitMQ + Kong Gateway + Grafana LGTM (observabilidade).
#
#   npm run docker:up     tudo em containers; acesso pelo Kong em http://localhost:8000
#   npm run docker:infra  só as dependências; a API roda no host (npm run dev:docker) e o Kong encaminha para ela
#   npm run docker:down   para tudo (docker compose down -v também apaga os dados)
#
# Os dois modos geram kong/kong.yml antes de subir (scripts/setup.kong.ts), apontando o Kong para o container
# "api" ou para o host. Por isso o Kong é recriado a cada subida.
name: api-clean-architecture

services:
  # Replica set de um nó: transações (dado + evento no outbox gravados juntos) exigem replica set.
  # O healthcheck inicia o replica set na primeira subida e só fica healthy com um primário eleito.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017" # só acessível da sua máquina (sem autenticação: uso local)
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    # appendonly: persiste os dados em disco; noeviction: o Redis nunca descarta chaves da fila (recomendado pelo BullMQ)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Banco de séries temporais para os dados dos sensores (passagens das ESP32).
  # Na primeira subida cria usuário, organização, bucket e o token de administração (valores locais, sem segredo real).
  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin-influx-local
      DOCKER_INFLUXDB_INIT_ORG: app
      DOCKER_INFLUXDB_INIT_BUCKET: sensors
      DOCKER_INFLUXDB_INIT_RETENTION: 400d # dados mais antigos são apagados automaticamente
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-influx-token-local # o mesmo de INFLUX_TOKEN no .env.docker
    ports:
      - "127.0.0.1:8086:8086" # API e interface web (http://localhost:8086, usuário admin)
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Barramento de mensagens entre microsserviços (publish/subscribe e RPC).
  # Interface de administração: http://localhost:15672 (usuário app / app-rabbit-local).
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq # o RabbitMQ guarda os dados por nome do nó: hostname fixo mantém filas e exchanges entre recriações
    environment:
      # o usuário padrão "guest" só aceita conexões de localhost; containers precisam de outro usuário
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app-rabbit-local
    ports:
      - "127.0.0.1:5672:5672" # AMQP
      - "127.0.0.1:15672:15672" # interface web
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Observabilidade (OpenTelemetry): Grafana + Tempo (traces) + Prometheus (métricas) + Loki (logs) em um contêiner.
  # A API envia traces, métricas e logs por OTLP; o Kong envia os traces do gateway.
  # Grafana em http://localhost:3001 (a porta 3000 é da API em desenvolvimento), entra direto como admin.
  lgtm:
    image: grafana/otel-lgtm:0.39.0
    ports:
      - "127.0.0.1:3001:3000" # Grafana
      - "127.0.0.1:4318:4318" # OTLP/HTTP (usado pela API rodando no host, no modo docker:infra)
    environment:
      # O Loki recusa logs com o disco acima de 90% ("Ingester is shutting down"). Em máquina de desenvolvimento com
      # disco cheio: LOKI_EXTRA_ARGS=-ingester.wal-disk-full-threshold=0 docker compose up -d lgtm
      LOKI_EXTRA_ARGS: ${LOKI_EXTRA_ARGS:-}
    volumes:
      - lgtm-data:/data
      - ./observability/grafana/dashboards:/otel-lgtm/dashboards/api:ro
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/api.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"] # criado pelo próprio LGTM quando todos os componentes respondem
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Prometheus avulso (opcional), coletando /metrics da API por scrape, como num cluster sem OTLP:
  # docker compose --profile metrics up -d prometheus -> http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["metrics"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # A API (Dockerfile na raiz). Usa as mesmas variáveis do .env.docker, trocando 127.0.0.1 pelos nomes dos serviços.
  # A porta não é publicada no host: o acesso é sempre pelo Kong. Para depurar direto, descomente "ports".
  api:
    build: .
    image: api-clean-architecture:local
    env_file: .env.docker
    environment:
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      REDIS_URL: redis://redis:6379
      INFLUX_URL: http://influxdb:8086
      RABBITMQ_URI: amqp://app:app-rabbit-local@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      PORT: "3000"
    volumes:
      # chaves geradas por npm run kong:setup; a privada (0600) precisa pertencer ao uid 1000 (usuário "node" da imagem)
      - ./keys:/app/keys:ro
    # ports:
    #   - "127.0.0.1:3001:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      # o barramento não impede a API de subir (os eventos ficam em buffer), mas assim evita logs de tentativa à toa
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 30s # tempo para terminar requisições e jobs em andamento antes do SIGKILL
    restart: unless-stopped
    read_only: true # a API não escreve em disco
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # API Gateway na frente da API: valida o JWT, aplica rate limit e limite de payload.
  # Encaminha para o container "api" (docker:up) ou para a API no host em host.docker.internal:3000 (docker:infra).
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off" # modo DB-less: toda a configuração vem do arquivo declarativo
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # traces do gateway (plugin opentelemetry): o trace começa no Kong e continua na API
      KONG_TRACING_INSTRUMENTATIONS: request,balancer
      KONG_TRACING_SAMPLING_RATE: "1.0"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro # gerado por npm run kong:setup
    ports:
      - "127.0.0.1:8000:8000" # proxy: é por aqui que os clientes acessam a API
      - "127.0.0.1:8001:8001" # Admin API (somente leitura no modo DB-less); nunca exponha publicamente
    extra_hosts:
      - "host.docker.internal:host-gateway" # modo docker:infra: permite ao container alcançar a API no host (Linux)
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
  redis-data:
  influx-data:
  influx-config:
  rabbitmq-data:
  lgtm-data:
