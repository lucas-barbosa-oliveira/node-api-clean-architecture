# Prometheus opcional (docker compose --profile metrics up -d prometheus): coleta as métricas da API.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      # docker:up (API em container) e docker:infra (API no host)
      - targets: ["api:9464", "host.docker.internal:9464"]
