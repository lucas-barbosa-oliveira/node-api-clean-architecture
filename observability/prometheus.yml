# Prometheus avulso (docker compose --profile metrics up -d prometheus): coleta /metrics da API por scrape.
# O Grafana LGTM recebe as mesmas métricas por OTLP; este arquivo mostra a alternativa por scrape.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      # docker:up (API em container) e docker:infra (API no host)
      - targets: ["api:9464", "host.docker.internal:9464"]
